# Render Blueprint — Infrastructure as Code ของ PairEval
# แก้ไฟล์นี้แล้ว push = โครงสร้าง infra เปลี่ยนตาม ตรวจได้ผ่าน code review
#
# วิธีใช้ครั้งแรก: Render Dashboard > New > Blueprint > เลือก repo นี้ > Apply
# Render จะถามค่าของ env var ที่ตั้ง sync: false ไว้

services:
  # ---------- Frontend: static site ที่ build จาก Vite ----------
  - type: web
    name: paireval-web
    runtime: static
    # static site ไม่มี region — Render เสิร์ฟผ่าน global CDN ให้อยู่แล้ว
    rootDir: frontend
    branch: develop # auto-deploy ทุก push เข้า develop (เป็น default ของ Render)
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA routing: path อย่าง /classrooms ไม่มีไฟล์จริงบน disk
    # ถ้าไม่ rewrite กลับไป index.html การกด refresh บนหน้านั้นจะได้ 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL ของ backend — กรอกหลัง paireval-api ขึ้นแล้ว
      # เป็น build-time env ของ Vite: แก้ค่าแล้วต้อง redeploy ถึงจะมีผล
      - key: VITE_API_BASE_URL
        sync: false

  # ---------- Backend: FastAPI ----------
  - type: web
    name: paireval-api
    runtime: python
    plan: free
    region: singapore # ใกล้ผู้ใช้ไทยที่สุด (default ของ Render คือ oregon)
    # Postgres ที่จะสร้างใน WS-03 ต้องอยู่ region เดียวกันนี้
    rootDir: backend
    branch: develop
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health # Render ใช้ตรวจว่า deploy สำเร็จจริง
    envVars:
      # origin ของ paireval-web — กรอกหลัง static site ขึ้นแล้ว
      - key: CORS_ORIGINS
        sync: false

      # ★ ตัวควบคุมความปลอดภัยที่สำคัญที่สุด
      # ถ้าไม่ใช่ "production" endpoint สำหรับ test (seed / cleanup / session)
      # จะถูกลงทะเบียนขึ้นมา ซึ่งแปลว่าใครก็ล้าง database และปลอมเป็นใครก็ได้
      # ห้ามเปลี่ยนค่านี้บน service ที่เข้าถึงได้จาก internet
      - key: ENVIRONMENT
        value: production

      # ใช้เซ็น session token — ต้องยาวอย่างน้อย 32 bytes (RFC 7518 §3.2)
      # generateValue ให้ Render สุ่มให้เอง จะได้ไม่มีใครเห็นค่าจริงเลยแม้แต่คนตั้ง
      - key: SESSION_SECRET
        generateValue: true
# ---------- Database ----------
# ยังไม่สร้างใน WS-01 โดยตั้งใจ:
# Render free Postgres หมดอายุใน 30 วัน และ WS-01/WS-02 ยังไม่ใช้ DB เลย
# จะปลดคอมเมนต์ตอน WS-03 ที่เริ่มมี business logic จริง
#
# databases:
#   - name: paireval-db
#     plan: free
#
# แล้วเพิ่มใน envVars ของ paireval-api:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: paireval-db
#       property: connectionString
