[pytest]
testpaths = tests
pythonpath = .

# integration test ถูกตัดออกจากการรันปกติโดยตั้งใจ
# unit loop ต้องอยู่ใต้ 10 วินาทีและรันได้โดยไม่ต้องมี Postgres — นั่นคือเงื่อนไขที่ทำให้
# มีคนรันมันจริงทุกครั้งที่แก้ code ถ้าลูปนี้ต้องยก database ขึ้นก่อน จะไม่มีใครรัน
#
#   pytest                  → unit + api (ไม่ต้องมี DB)
#   pytest -m integration   → เฉพาะที่ต้องมี Postgres จริง
#   pytest -m ""            → ทั้งหมด
addopts = -q -m "not integration"

markers =
    integration: ต้องมี Postgres จริงตาม DATABASE_URL — ดู docker compose up -d db
