# nginx config ของ runtime stage — เขียนเองทั้งไฟล์เพื่อคุม path ที่ต้องเขียนได้
# ให้ย้ายออกจาก /var/run และ /var/cache ซึ่ง user `nginx` (non-root) เขียนไม่ได้

worker_processes auto;

# default คือ /var/run/nginx.pid ที่มีแต่ root เขียนได้ — ย้ายมา /tmp เพื่อรันแบบ non-root
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ทุก path ที่ nginx ต้องเขียนระหว่างทำงาน ย้ายมาไว้ใต้ /tmp ด้วยเหตุผลเดียวกับ pid
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  keepalive_timeout 65;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  server {
    # 8080 ไม่ใช่ 80 เพราะพอร์ตต่ำกว่า 1024 ต้องใช้สิทธิ์ root ถึงจะ bind ได้
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Google Sign-In เปิด popup แล้วคุยกลับด้วย window.postMessage
    # ต้องตั้งค่าเดียวกับ vite.config.ts และ render.yaml ไม่งั้นปุ่ม login กดแล้วเงียบ
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    # PRD §14.3 FR-SEC-01 — ค่าชุดเดียวกับ render.yaml · CSP อยู่ใน <meta> ที่ vite.config.ts ใส่ตอน build
    # HSTS ถูกเบราว์เซอร์เพิกเฉยเมื่อเสิร์ฟผ่าน http (container ในเครื่อง) แต่มีผลจริงเมื่ออยู่หลัง https
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # asset ที่ Vite ใส่ hash ในชื่อไฟล์แล้ว cache ยาวได้ เพราะชื่อเปลี่ยนทุกครั้งที่ content เปลี่ยน
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      # add_header ใน location ทำให้ header ระดับ server ไม่ถูกสืบทอด — ต้องใส่ซ้ำ
      add_header X-Content-Type-Options nosniff always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA routing: /classrooms ไม่มีไฟล์จริงบน disk — ถ้าไม่ fallback ไป index.html
    # การกด refresh บนหน้านั้นจะได้ 404 (กติกาเดียวกับ rewrite ใน render.yaml)
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
