# FR-SEC-07 (GAP-07) — เปิด PR อัปเดต dependency ที่มีช่องโหว่หรือเก่า ทุกสัปดาห์ เข้า develop
# (develop = staging ตาม AGENTS.md — ต้องผ่าน CI ทั้งชุดก่อนถึง main)
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # action ถูก pin ด้วย SHA — dependabot อัปเดต SHA + comment เวอร์ชันให้เอง
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
