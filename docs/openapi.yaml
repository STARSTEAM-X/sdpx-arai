openapi: 3.1.0

info:
  title: PairEval API
  version: 0.1.0-M1
  license:
    name: MIT
    identifier: MIT
  description: |
    API ของระบบประเมินผลงานนักศึกษาแบบ pairwise comparison

    **ขอบเขตของเอกสารนี้คือ M1 Walking Skeleton** — ทุก endpoint ที่นี่สืบกลับไปหา
    user story ใน `docs/backlog.md` ได้ และทุก story ใน Sprint 1 มี endpoint รองรับ

    หลักที่ยึดทั้งไฟล์
    - ทุก endpoint ยกเว้น `/api/health` ต้องมี bearer token
    - ตรวจสิทธิ์ที่ server เสมอ (FR-AUTHZ-01) — ห้ามพึ่ง UI ในการซ่อน
    - ขอ resource ของ classroom ที่ไม่ได้สังกัด ตอบ **404 ไม่ใช่ 403**
      เพื่อไม่ให้รู้ว่า resource นั้นมีอยู่จริง (FR-AUTHZ-02)
    - error ใช้รูปแบบเดียวกันทั้งระบบ และ `code` คงที่สำหรับเครื่องอ่าน (FR-API-03)
    - timestamp ทุกตัวเป็น UTC (DR-05)

servers:
  - url: https://paireval-api.onrender.com
    description: Staging
  - url: http://localhost:8000
    description: Local

security:
  - bearerAuth: []

tags:
  - name: health
    description: ตรวจสถานะระบบ
  - name: auth
    description: เข้าสู่ระบบและข้อมูลผู้ใช้ปัจจุบัน
  - name: classrooms
    description: ห้องเรียนและรายชื่อ
  - name: assignments
    description: งานประเมินและการจัดคู่
  - name: evaluation
    description: การประเมินของนักศึกษา
  - name: scoring
    description: คำนวณ ประกาศ และดูคะแนน (US-13, US-15, US-16)

paths:
  /api/health:
    get:
      tags: [health]
      summary: ตรวจว่า service พร้อมรับ traffic
      description: |
        ใช้เป็นด่านตรวจ 3 ที่ — Render healthCheckPath, HEALTHCHECK ของ Docker (WS-05)
        และตรวจว่า staging พร้อมก่อนยิง load test (WS-07)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: service พร้อมใช้งาน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/session:
    post:
      tags: [auth]
      summary: แลก Google id_token เป็น session ของระบบ
      description: |
        อ้าง US-01 — client ทำ OIDC flow กับ Google เองแล้วส่ง `idToken` มาที่นี่

        ระบบจะ normalize อีเมล (lowercase, ตัด dot ใน gmail, ตัด `+tag`) ก่อนจับคู่กับ roster
        (FR-AUTH-03) และถ้า user มีสถานะ `PENDING` อยู่จะเปลี่ยนเป็น `ACTIVE` (FR-CLASS-04)
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: id_token ที่ได้จาก Google OIDC
      responses:
        '200':
          description: login สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'id_token ไม่ถูกต้องหรือหมดอายุ (`code: INVALID_ID_TOKEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            อีเมลอยู่นอก domain ที่ classroom อนุญาต (`code: DOMAIN_NOT_ALLOWED`)
            message ต้องบอกด้วยว่า domain ไหนที่รับ (FR-AUTH-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/me:
    get:
      tags: [auth]
      summary: ข้อมูลผู้ใช้ปัจจุบันและ role ในแต่ละห้องเรียน
      description: 'อ้าง US-01 — frontend ใช้ตัดสินว่าจะแสดงเมนูของอาจารย์หรือของนักศึกษา'
      operationId: getMe
      responses:
        '200':
          description: ข้อมูลผู้ใช้ปัจจุบัน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/classrooms:
    get:
      tags: [classrooms]
      summary: รายการห้องเรียนที่ฉันเกี่ยวข้อง
      description: 'อ้าง US-02 — คืนเฉพาะ classroom ที่ผู้เรียกเป็นสมาชิกเท่านั้น'
      operationId: listClassrooms
      responses:
        '200':
          description: รายการห้องเรียน
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Classroom'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [classrooms]
      summary: สร้างห้องเรียน
      description: 'อ้าง US-02 — ผู้สร้างจะได้ role OWNER ของห้องเรียนนั้นทันที'
      operationId: createClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomCreate'
      responses:
        '201':
          description: สร้างสำเร็จ คืน resource ที่สร้าง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/classrooms/{classroomId}/members:
    post:
      tags: [classrooms]
      summary: เพิ่มผู้ร่วมสอนหรือ TA
      description: |
        อ้าง US-12 — เฉพาะ `OWNER` เท่านั้นที่ทำได้ · `CO_TEACHER` และ `TA` ได้ `403`
        ส่วนคนที่ไม่ใช่สมาชิกของห้องนี้ได้ `404` ไม่ใช่ `403` (กฎเดียวกับ US-11)

        ถ้าอีเมลนั้นยังไม่เคย login ระบบสร้าง user สถานะ `PENDING` ให้ เหมือนตอน import roster
        อีเมลถูก normalize ด้วยกฎเดียวกับ US-01 และ US-03 เพื่อไม่ให้คนเดียวกันกลายเป็นสองบัญชี
      operationId: addClassroomMember
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [CO_TEACHER, TA]
                  description: |
                    `OWNER` เพิ่มผ่าน endpoint นี้ไม่ได้ — เจ้าของเกิดจากการสร้างห้องเรียน
                    ส่วน `STUDENT` มาจากการ import roster (US-03)
      responses:
        '201':
          description: เพิ่มสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [memberId, email, role]
                properties:
                  memberId:
                    type: string
                    format: uuid
                  email:
                    type: string
                  role:
                    $ref: '#/components/schemas/ClassroomRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: อีเมลนี้เป็นสมาชิกห้องนี้อยู่แล้ว — 1 คนมีได้ 1 role ต่อ 1 ห้อง (FR-AUTHZ-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/classrooms/{classroomId}/members/{memberId}:
    delete:
      tags: [classrooms]
      summary: ถอดสมาชิกออกจากห้องเรียน
      description: |
        อ้าง US-12 — เฉพาะ `OWNER` · ถอด `OWNER` คนสุดท้ายไม่ได้ (รวมถึงถอดตัวเอง)
        `memberId` มาจาก `GET /roster`
      operationId: removeClassroomMember
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: ถอดสำเร็จ
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            ถอดเจ้าของห้องคนสุดท้ายไม่ได้ — `code: LAST_OWNER`
            ห้องเรียนที่ไม่มีเจ้าของจะไม่มีใครจัดการสมาชิกหรือตัดสินคะแนนได้อีก
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/classrooms/{classroomId}/assignments:
    get:
      tags: [classrooms]
      summary: รายการงานประเมินในห้องนี้
      description: |
        อ้าง US-07 — **ไม่ได้ระบุไว้ตรง ๆ ใน PRD §12** เป็นช่องว่างเดียวกับที่ US-01/US-12
        เคยเจอตอนไล่ตาราง traceability: ไม่มีทางให้นักศึกษารู้ id ของ assignment
        เพื่อเรียก `/my-evaluations` ต่อได้เลยถ้าไม่มี endpoint นี้

        นักศึกษาไม่เห็นงานที่ยังเป็น `DRAFT` เพราะยังไม่ควรรู้ด้วยซ้ำว่ามีงานนี้อยู่
        ผู้สอน (มี `MANAGE_ASSIGNMENT`) เห็นทุกสถานะเพื่อกลับมาแก้งานที่ทำค้างไว้ได้
      operationId: listClassroomAssignments
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
      responses:
        '200':
          description: รายการงานประเมิน
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/classrooms/{classroomId}/audit:
    get:
      tags: [classrooms]
      summary: อ่าน audit log ของห้องเรียน
      description: |
        อ้าง US-14 — นักศึกษาได้ `403` · คนนอกห้องได้ `404`

        **ไม่มี endpoint สำหรับแก้หรือลบโดยตั้งใจ** audit เป็น append-only
        และมี trigger ที่ระดับ database กันไว้อีกชั้น เผื่อทางที่ API ยังไม่ได้ปิด
      operationId: listAudit
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
      responses:
        '200':
          description: รายการเหตุการณ์ เรียงใหม่สุดก่อน
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/classrooms/{classroomId}/roster:
    get:
      tags: [classrooms]
      summary: ดูรายชื่อสมาชิกในห้องเรียน
      description: 'อ้าง US-03'
      operationId: getRoster
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
      responses:
        '200':
          description: รายชื่อสมาชิก
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RosterEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/classrooms/{classroomId}/roster:import:
    post:
      tags: [classrooms]
      summary: นำเข้ารายชื่อจากไฟล์ CSV
      description: |
        อ้าง US-03 — การนำเข้าเป็น **atomic** ถ้ามีแถวใดผิด จะไม่บันทึกแถวใดเลย
        และรายงานเลขแถวที่ผิด (FR-CLASS-02)

        CSV ต้องมี header `email` และ `group_name` (ไม่สนตัวพิมพ์เล็กใหญ่)
        ส่วน `student_id` และ `display_name` เป็นทางเลือก
      operationId: importRoster
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ไฟล์ CSV
      responses:
        '200':
          description: นำเข้าสำเร็จทั้งไฟล์
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            ไฟล์มีแถวที่ผิด — ไม่มีแถวใดถูกบันทึก
            `details` ระบุเลขแถวและสาเหตุของทุกแถวที่ผิด
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments:
    post:
      tags: [assignments]
      summary: สร้างงานประเมิน
      description: |
        อ้าง US-04 — งานที่สร้างใหม่มีสถานะ `DRAFT` เสมอ
        ผลรวมน้ำหนักของ criteria แต่ละ side จะถูกตรวจตอน publish ไม่ใช่ตอนสร้าง
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/assignments/{assignmentId}:
    get:
      tags: [assignments]
      summary: ดูงานประเมินหนึ่งงานพร้อมเกณฑ์
      description: 'อ้าง US-04'
      operationId: getAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: งานประเมิน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assignments/{assignmentId}/criteria:
    put:
      tags: [assignments]
      summary: แทนที่เกณฑ์ทั้งชุด
      description: |
        อ้าง US-04 — ทำได้เฉพาะตอนสถานะยังเป็น `DRAFT`
        งานที่ประกาศไปแล้วอาจมีคนเริ่มประเมินตามเกณฑ์ชุดเดิม การเปลี่ยนน้ำหนักกลางคัน
        ทำให้คะแนนจากคำตอบเก่ากับใหม่เทียบกันไม่ได้ จึงตอบ `409` แทนที่จะยอมให้แก้

        ส่งทั้งชุดไม่ใช่ทีละข้อ เพราะหน้าจอที่แก้เกณฑ์ในตารางเดียวมักยังไม่มี id
        ของแถวที่เพิ่งเพิ่ม การส่งทั้งชุดจึงตรงกับวิธีที่ UI ใช้จริงกว่า
      operationId: replaceCriteria
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [criteria]
              properties:
                criteria:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/CriterionCreate'
      responses:
        '200':
          description: เกณฑ์ชุดใหม่
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/assignments/{assignmentId}/feasibility:
    get:
      tags: [assignments]
      summary: ตรวจความเป็นไปได้ของการจัดคู่ก่อน publish
      description: |
        อ้าง US-05 — ถ้า `target_coverage` ที่ตั้งไว้เป็นไปไม่ได้
        ระบบคืนค่าสูงสุดที่ทำได้จริงพร้อมเหตุผลเป็นตัวเลข (FR-PAIR-05)
      operationId: getFeasibility
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: |
            ผลการคำนวณความเป็นไปได้ — คืน **ทั้งสองฝั่ง** เมื่อเปิดการประเมินรายบุคคลไว้
            เพราะข้อจำกัดของสองฝั่งคนละเรื่องกัน: ฝั่งกลุ่มถูกบีบด้วยจำนวนกลุ่มและ workload
            ส่วนฝั่งบุคคลถูกบีบด้วยขนาดกลุ่มล้วน ๆ (D4)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Feasibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assignments/{assignmentId}:publish:
    post:
      tags: [assignments]
      summary: เผยแพร่งานและสร้างคู่ประเมินทั้งหมด
      description: |
        อ้าง US-06 — สร้าง pair ทั้งหมดเก็บลง database ตอนนี้ ไม่สุ่มตอน runtime (FR-PAIR-01)
        ให้ `pairing_seed` เดิมแล้วผลต้องเหมือนเดิมทุกครั้ง (FR-PAIR-09)
      operationId: publishAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: เผยแพร่สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'สถานะไม่ใช่ DRAFT จึง publish ไม่ได้ (`code: INVALID_STATE`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'ผลรวมน้ำหนัก criteria ไม่เท่ากับ 100 (`code: WEIGHT_SUM_INVALID`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/my-evaluations:
    get:
      tags: [evaluation]
      summary: คู่ที่ฉันต้องประเมินและความคืบหน้า
      description: |
        อ้าง US-07 — คืนเฉพาะคู่ของผู้เรียกเท่านั้น เปิดให้สมาชิกทุก role ของห้องเรียน
        ไม่ใช่แค่ผู้สอน เพราะนักศึกษาคือผู้ใช้หลักของ endpoint นี้

        **ยังไม่เปิด (`DRAFT`) ไม่ใช่ error** — ตอบ `200` เสมอพร้อม `opened: false`
        และ `message` อธิบายเหตุผล เพื่อให้หน้าเว็บ render ข้อความปกติได้ทันที
        ไม่ต้องแยก branch จัดการ error สำหรับสถานะที่คาดไว้อยู่แล้ว
      operationId: getMyEvaluations
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - name: side
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Side'
      responses:
        '200':
          description: 'รายการคู่ที่ต้องประเมิน (หรือ opened=false ถ้ายังไม่เปิด)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEvaluations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/comparisons/{pairAssignmentId}:
    put:
      tags: [evaluation]
      summary: บันทึกคำตอบของคู่หนึ่ง (autosave)
      description: |
        อ้าง US-08 — **idempotent** เรียกซ้ำด้วย body เดิมได้ผลเดิม ไม่เกิดแถวซ้ำ (FR-API-01)
        บันทึกเป็นสถานะ `DRAFT` จนกว่าจะเรียก submissions
      operationId: saveComparison
      parameters:
        - name: pairAssignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonSave'
      responses:
        '200':
          description: บันทึกแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'ผู้เรียกไม่ใช่ evaluator ของคู่นี้ (`code: NOT_YOUR_PAIR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'เลย deadline แล้ว (`code: DEADLINE_PASSED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/assignments/{assignmentId}/submissions:
    post:
      tags: [evaluation]
      summary: ส่งคำตอบทั้ง side
      description: |
        อ้าง US-09 — เปลี่ยนทุก comparison ของ side นั้นที่**เคยตอบไว้แล้ว**เป็น `SUBMITTED`
        ต้องส่ง header `Idempotency-Key` เพื่อกันการกดซ้ำจากหลายแท็บ (FR-API-02) —
        เรียกซ้ำด้วย key เดิมได้ response เดิมทุกครั้ง (`submittedCount`/`submittedAt` ไม่ขยับ)

        **ตอบไม่ครบไม่ใช่ error** — เคยเขียนไว้ว่า 422 แต่ขัดกับ FR-EVAL-05 ที่บังคับให้ปุ่มส่ง
        เปิดใช้ได้ตลอดแม้ตอบไม่ครบ (ดูบันทึกการตัดสินใจใน `docs/backlog.md` ที่ US-09)
        endpoint นี้จึง submit เท่าที่มีเสมอ คู่ที่ไม่เคยตอบเลยไม่ถูกแตะ ไม่ใช่ปฏิเสธทั้งคำขอ
        ฝั่งหน้าเว็บเป็นคนแสดง "ยังเหลือ N คู่ ยืนยันจะส่งไหม" ก่อนเรียก endpoint นี้เอง
      operationId: submitEvaluations
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - name: Idempotency-Key
          in: header
          required: true
          description: ค่าไม่ซ้ำที่ client สร้างขึ้นต่อการกดส่ง 1 ครั้ง
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side:
                  $ref: '#/components/schemas/Side'
      responses:
        '200':
          description: ส่งสำเร็จ (นับเฉพาะคู่ที่เคยตอบไว้ — อาจน้อยกว่าจำนวนคู่ทั้งหมด)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'เลย deadline แล้ว (`code: DEADLINE_PASSED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/assignments/{assignmentId}:recompute:
    post:
      tags: [scoring]
      summary: คำนวณคะแนนชั่วคราวใหม่
      description: |
        อ้าง US-13, US-16 — คำนวณด้วย `is_final=false` ทับ interim เดิมเสมอ เรียกได้ตลอด
        หลัง publish ไม่ต้องรอ deadline (FR-SCORE-06) ใช้ดูความคืบหน้าระหว่างทาง
        ไม่เปลี่ยนสถานะ assignment และไม่ถูก audit เพราะยังไม่ใช่คะแนนที่เชื่อถือได้
      operationId: recomputeScores
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: คำนวณเสร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomputeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'role ไม่มี capability `MANAGE_ASSIGNMENT` (`code: FORBIDDEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assignments/{assignmentId}:finalize:
    post:
      tags: [scoring]
      summary: ตัดสินและประกาศคะแนน
      description: |
        อ้าง US-13 — เฉพาะ OWNER (capability `FINALIZE_SCORES`) เรียกได้ ต้องเลย
        `groupDeadlineUtc` ไปแล้วและ assignment อยู่ในสถานะ `PUBLISHED`/`OPEN`/`CLOSED`
        คำนวณด้วย `is_final=true` ทับ interim เดิม แล้ว snapshot ไว้เป็นคะแนนที่เชื่อถือได้
        (`computed_score` เก็บค่าที่คำนวณได้ ณ ตอนนั้นตรง ๆ — ตรวจย้อนหลังได้แม้สูตรจะเปลี่ยนไปแล้ว)

        ถ้ามี item ที่ผู้ประเมินยังไม่ถึงเกณฑ์ขั้นต่ำ (`LOW_CONFIDENCE`) endpoint นี้จะปฏิเสธ
        ด้วย 422 จนกว่าจะส่ง `confirmLowConfidence: true` มายืนยัน — ระบบไม่ finalize ให้อัตโนมัติ
      operationId: finalizeAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAssignment'
      responses:
        '200':
          description: ประกาศผลแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'role ไม่มี capability `FINALIZE_SCORES` — มีเฉพาะ OWNER (`code: FORBIDDEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'สถานะไม่ใช่ PUBLISHED/OPEN/CLOSED หรือยังไม่ถึง deadline (`code: ALREADY_EXISTS`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'มี item ติด LOW_CONFIDENCE และยังไม่ได้ส่ง confirmLowConfidence (`code: VALIDATION_FAILED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}:reopen:
    post:
      tags: [scoring]
      summary: เปิดคะแนนที่ finalize แล้วกลับมาแก้
      description: |
        อ้าง US-13 — เฉพาะ OWNER เรียกได้ ต้องเป็นงานที่สถานะ `FINALIZED` เท่านั้น
        สถานะหลัง reopen กลับไปเป็น `CLOSED` (ไม่ใช่ `PUBLISHED`) ต้องเรียก `:finalize` ใหม่
        อีกครั้งเพื่อประกาศผล ต้องระบุเหตุผลเสมอเพราะกระทบความเชื่อมั่นของนักศึกษาที่เห็นคะแนน
        ไปแล้ว (`AuditAction.SCORES_REOPENED` อยู่ใน `ACTIONS_REQUIRING_REASON`)
      operationId: reopenAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenAssignment'
      responses:
        '200':
          description: เปิดกลับมาแก้แล้ว
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [CLOSED]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'role ไม่มี capability `FINALIZE_SCORES` (`code: FORBIDDEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'ยังไม่ได้ finalize (`code: ALREADY_EXISTS`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'ไม่ได้ระบุเหตุผล (`code: VALIDATION_FAILED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/comparisons:export:
    get:
      tags: [scoring]
      summary: ส่งออก raw comparison เป็น CSV (ปกปิดตัวตนผู้ประเมิน)
      description: |
        อ้าง US-15, FR-EXPORT-03 — ผู้เรียกที่มี capability `MANAGE_ASSIGNMENT` เรียกได้
        (OWNER และ CO_TEACHER) เพราะไฟล์นี้**ไม่มี**ตัวตนจริงของผู้ประเมินอยู่เลย มีแต่รหัส
        `E1, E2, ...` ที่สุ่มลำดับใหม่ทุกครั้งที่เรียก — ใช้ข้ามการ export ครั้งอื่นไม่ได้

        UTF-8 พร้อม BOM (FR-EXPORT-01) กันข้อความไทยเพี้ยนตอนเปิดด้วย Excel
        เอาเฉพาะ comparison ที่ `SUBMITTED` แล้ว (S2) — DRAFT ไม่เคยเข้าเงื่อนไขการคำนวณ
        คะแนน จึงไม่ควรอยู่ในไฟล์ที่ใช้ตรวจสอบคะแนนย้อนหลังเช่นกัน

        ต้องการตัวตนจริงของผู้ประเมิน ใช้ `POST .../comparisons:export-identified` แทน
      operationId: exportComparisons
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: ไฟล์ CSV
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assignments/{assignmentId}/comparisons:export-identified:
    post:
      tags: [scoring]
      summary: ส่งออก raw comparison พร้อมอีเมลจริงของผู้ประเมิน
      description: |
        อ้าง US-15, FR-EXPORT-04 — เฉพาะ OWNER (capability `VIEW_EVALUATOR_IDENTITY`)
        ต้องระบุเหตุผลเสมอ (คือการ "ยืนยันเจตนา" ตาม AC) และถูกบันทึกลง audit log
        ทุกครั้งแบบไม่มีข้อยกเว้น (`AuditAction.IDENTIFIED_EXPORT`) — เรียกสำเร็จแล้วไม่มี
        ร่องรอยเป็นไปไม่ได้ เพราะ audit เขียนใน transaction เดียวกับการ export (FR-AUDIT-01)
      operationId: exportComparisonsIdentified
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: ไฟล์ CSV พร้อมอีเมลจริงของผู้ประเมิน
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'role ไม่มี capability `VIEW_EVALUATOR_IDENTITY` — มีเฉพาะ OWNER (`code: FORBIDDEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'ไม่ได้ระบุเหตุผล (`code: VALIDATION_FAILED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/score-overrides:
    post:
      tags: [scoring]
      summary: แก้คะแนนที่คำนวณได้ด้วยมือ
      description: |
        อ้าง US-13, FR-SCORE-08 — เฉพาะ OWNER เรียกได้ บันทึกเป็นแถวใหม่เสมอ (ประวัติสะสม
        ไม่ทับของเดิม) ค่าที่มีผลจริงคือแถวล่าสุดของ item/เกณฑ์นั้น ต้องระบุเหตุผลเสมอ
        และถูกบันทึกลง audit log ครบ actor/ก่อน/หลัง/เหตุผล/เวลา (FR-AUDIT-02)
      operationId: createScoreOverride
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreOverrideCreate'
      responses:
        '201':
          description: บันทึกการ override แล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreOverrideResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'role ไม่มี capability `FINALIZE_SCORES` (`code: FORBIDDEN`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'ไม่ได้ระบุเหตุผล (`code: VALIDATION_FAILED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/my-score:
    get:
      tags: [evaluation]
      summary: คะแนนของฉัน
      description: |
        อ้าง US-10 — สมาชิกห้องเรียนคนไหนก็เรียกได้ (ไม่ต้องมี capability พิเศษ)
        ถ้า assignment ยังไม่ `FINALIZED` ตอบ 200 พร้อม `finalized: false` และ `message`
        อธิบาย — **ไม่มีตัวเลขคะแนนใด ๆ ติดมาเลย** ไม่ใช่ 404 เพราะ "ยังไม่ประกาศ" เป็นสถานะ
        ปกติของ workflow ไม่ใช่ error

        คะแนนรายบุคคล (`individualComponent`) จะเป็น `null` และ `individualHidden: true`
        ถ้าจำนวนผู้ประเมินรายบุคคลของ item นี้ยังไม่ถึงเกณฑ์ k-anonymity (US-15 —
        ใช้ `min_comparisons` ของ assignment เป็นเกณฑ์ร่วม ไม่มีคอลัมน์แยก) เมื่อซ่อน
        `finalScore` (ที่รวมคะแนนรายบุคคลไว้ด้วย) จะถูกซ่อนไปด้วยเช่นกัน ไม่ใช่แค่
        `individualComponent` เพียงอย่างเดียว — เพื่อไม่ให้เดาย้อนกลับได้จากผลรวม
      operationId: getMyScore
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: คะแนนของผู้เรียก (หรือสถานะ "ยังไม่ประกาศผล" ถ้ายังไม่ finalize)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: token ที่ได้หลัง login ผ่าน Google OIDC (US-01)

  parameters:
    ClassroomId:
      name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: 'ไม่ได้แนบ token หรือ token หมดอายุ (`code: UNAUTHENTICATED`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 'login แล้วแต่ role ไม่มีสิทธิ์ทำสิ่งนี้ (`code: FORBIDDEN`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        ไม่พบ resource — **รวมถึงกรณีที่ resource มีอยู่จริงแต่อยู่คนละ classroom**
        ตั้งใจตอบ 404 แทน 403 เพื่อไม่ให้รู้ว่ามีอยู่จริง (FR-AUTHZ-02)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 'ชนกับข้อมูลที่มีอยู่แล้ว (`code: ALREADY_EXISTS`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: 'รูปแบบข้อมูลไม่ผ่านการตรวจ (`code: VALIDATION_FAILED`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: รหัสคงที่สำหรับเครื่องอ่าน แยกจาก message ที่คนอ่าน
              examples: [DEADLINE_PASSED]
            message:
              type: string
              examples: ['เลยกำหนดส่งของงานนี้แล้ว']
            field:
              type: [string, 'null']
              description: ชื่อ field ที่ผิด ถ้าเป็น validation error
            details:
              type: array
              description: ใช้เมื่อมีข้อผิดพลาดหลายจุด เช่น CSV หลายแถวผิด
              items:
                type: object
                properties:
                  row:
                    type: integer
                  reason:
                    type: string
            requestId:
              type: string
              description: ใช้ตามรอยใน structured log (WS-07)

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: 7 ตัวแรกของ commit SHA ที่กำลังรัน
          examples: [dcec4e1]

    Side:
      type: string
      enum: [GROUP, INDIVIDUAL]

    Session:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: ใช้เป็น bearer token ในทุก request ถัดไป
        expiresAt:
          type: string
          format: date-time
          description: หมดอายุใน 12 ชั่วโมงตาม FR-AUTH-04
        user:
          $ref: '#/components/schemas/Me'

    ClassroomRole:
      type: object
      required: [classroomId, classroomName, role]
      properties:
        classroomId:
          type: string
          format: uuid
        classroomName:
          type: string
        role:
          type: string
          enum: [OWNER, CO_TEACHER, TA, STUDENT]

    Me:
      type: object
      required: [userId, email, status, classrooms]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING, ACTIVE, DISABLED]
        classrooms:
          type: array
          description: |
            1 คนเป็น instructor ใน classroom หนึ่งและเป็น student ในอีก classroom ได้
            (FR-AUTHZ-03) จึงต้องคืน role แยกต่อ classroom ไม่ใช่ role เดียวต่อคน
          items:
            $ref: '#/components/schemas/ClassroomRole'

    Classroom:
      type: object
      required: [id, name, slug, timezone, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
          examples: [Asia/Bangkok]
        allowedEmailDomains:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        createdAt:
          type: string
          format: date-time

    ClassroomCreate:
      type: object
      required: [name, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          examples: [Asia/Bangkok]
        allowedEmailDomains:
          type: array
          description: ถ้าเว้นว่าง = รับทุก domain
          items:
            type: string

    AuditEntry:
      type: object
      required: [id, actorEmail, action, resourceType, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorEmail:
          type: string
        action:
          type: string
          description: เหตุการณ์ที่ FR-AUDIT-01 บังคับให้บันทึก
          examples: [ASSIGNMENT_PUBLISHED, MEMBER_ROLE_CHANGED, SCORES_FINALIZED]
        resourceType:
          type: string
        resourceId:
          type: [string, 'null']
        beforeState:
          type: [object, 'null']
        afterState:
          type: [object, 'null']
        reason:
          type: [string, 'null']
          description: บังคับสำหรับ action ที่แทรกแซงคะแนนด้วยมือ (FR-AUDIT-02)
        occurredAt:
          type: string
          format: date-time
          description: UTC เสมอ

    RosterEntry:
      type: object
      required: [memberId, userId, email, role, status]
      properties:
        memberId:
          type: string
          format: uuid
          description: id ของแถวสมาชิก — ใช้ตอนถอดสมาชิกออกจากห้อง (US-12)
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
        role:
          type: string
          enum: [OWNER, CO_TEACHER, TA, STUDENT]
        groupName:
          type: [string, 'null']
          description: มีค่าเฉพาะ role STUDENT
        status:
          type: string
          enum: [PENDING, ACTIVE, DISABLED]

    RosterImportResult:
      type: object
      required: [imported, groupsCreated, warnings]
      properties:
        imported:
          type: integer
          description: จำนวนแถวที่บันทึกสำเร็จ
        groupsCreated:
          type: integer
        warnings:
          type: array
          description: เรื่องที่ควรรู้แต่ไม่ถึงกับ reject เช่น กลุ่มมีสมาชิกน้อยกว่า 2
          items:
            type: object
            required: [type, message]
            properties:
              type:
                type: string
                enum: [GROUP_TOO_SMALL, DUPLICATE_EMAIL_MERGED]
              message:
                type: string

    CriterionCreate:
      type: object
      required: [side, name, weightPct]
      properties:
        side:
          $ref: '#/components/schemas/Side'
        name:
          type: string
          minLength: 1
        weightPct:
          type: number
          minimum: 0
          maximum: 100
        displayOrder:
          type: integer

    AssignmentCreate:
      type: object
      required:
        - classroomId
        - name
        - groupMaxScore
        - individualMaxScore
        - groupDeadlineUtc
        - criteria
      properties:
        classroomId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        artifactUrl:
          type: string
          format: uri
        groupMaxScore:
          type: number
          minimum: 0
        individualMaxScore:
          type: number
          minimum: 0
          description: ใส่ 0 แปลว่าไม่มีการประเมินรายบุคคล ระบบจะไม่สร้าง pair ฝั่งนั้น
        groupDeadlineUtc:
          type: string
          format: date-time
        individualDeadlineUtc:
          type: [string, 'null']
          format: date-time
        targetCoverage:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        maxWorkload:
          type: integer
          minimum: 1
          maximum: 30
          default: 8
        criteria:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CriterionCreate'

    Assignment:
      type: object
      required: [id, classroomId, name, status, criteria]
      properties:
        id:
          type: string
          format: uuid
        classroomId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, OPEN, CLOSED, FINALIZED, ARCHIVED]
        groupDeadlineUtc:
          type: string
          format: date-time
        individualDeadlineUtc:
          type: [string, 'null']
          format: date-time
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'

    AssignmentSummary:
      type: object
      description: รูปย่อของ Assignment สำหรับหน้ารายการ — ไม่มี criteria เพราะหน้ารายการไม่ใช้
      required: [id, name, status, groupDeadlineUtc]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, OPEN, CLOSED, FINALIZED, ARCHIVED]
        groupDeadlineUtc:
          type: string
          format: date-time
        individualDeadlineUtc:
          type: [string, 'null']
          format: date-time

    Criterion:
      type: object
      required: [id, side, name, weightPct, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/Side'
        name:
          type: string
        weightPct:
          type: number
        displayOrder:
          type: integer

    Feasibility:
      type: object
      required: [side, requestedCoverage, achievableCoverage, workloadPerEvaluator, totalComparisons, feasible]
      properties:
        side:
          $ref: '#/components/schemas/Side'
        requestedCoverage:
          type: integer
        achievableCoverage:
          type: integer
          description: ค่าสูงสุดที่ทำได้จริงตามขนาดกลุ่มและ maxWorkload
        workloadPerEvaluator:
          type: number
        totalComparisons:
          type: integer
        feasible:
          type: boolean
        reason:
          type: [string, 'null']
          description: ถ้า feasible = false ต้องอธิบายด้วยตัวเลข ไม่ใช่คำเตือนลอย ๆ
        lowAnonymityNote:
          type: [string, 'null']
          description: |
            เฉพาะฝั่ง INDIVIDUAL — เตือนเมื่อมีกลุ่มที่ผู้ประเมินต่อ item (m − 1) ต่ำกว่า
            min_comparisons ของงานนี้ (US-15) คะแนนรายบุคคลของกลุ่มนั้นจะถูกซ่อนโดย
            k-anonymity ตลอดไป ไม่ว่าจะรอให้ใครส่งเพิ่มอีกกี่คนก็ตาม — ไม่ใช่ error
            (feasible ยังเป็น true ปกติ, publish ได้) เป็นแค่คำเตือนให้ตัดสินใจล่วงหน้า

    PublishResult:
      type: object
      required: [assignmentId, status, pairsCreated, pairingSeed]
      properties:
        assignmentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PUBLISHED]
        pairsCreated:
          type: integer
        pairingSeed:
          type: integer
          format: int64
          description: เก็บไว้เพื่อ generate ซ้ำให้ได้ผลเดิม (FR-PAIR-09)

    EvaluationItem:
      type: object
      description: |
        คู่หนึ่งที่ต้องประเมิน — left/right แบนราบตามตำแหน่งจริงที่สุ่มไว้ตอน publish (D8/FR-PAIR-08)
        ไม่มี artifactUrl ต่อ item เพราะ assignment มี artifact_url ช่องเดียว (ดู MyEvaluations)
      required:
        - pairAssignmentId
        - criterionId
        - criterionName
        - leftId
        - leftLabel
        - rightId
        - rightLabel
        - completed
        - choice
      properties:
        pairAssignmentId:
          type: string
          format: uuid
        criterionId:
          type: string
          format: uuid
        criterionName:
          type: string
          description: 'เกณฑ์เดียวกัน (side) มีได้หลายเกณฑ์ — ใช้ค่านี้แบ่ง section ตาม FR-EVAL-01'
        leftId:
          type: string
          format: uuid
          description: group_entity.id หรือ user.id ตาม side
        leftLabel:
          type: string
        rightId:
          type: string
          format: uuid
        rightLabel:
          type: string
        completed:
          type: boolean
          description: มี comparison สถานะ SUBMITTED แล้วหรือยัง
        choice:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
          description: |
            ค่าที่เคยเลือกไว้ (DRAFT หรือ SUBMITTED) — null ถ้ายังไม่เคยตอบ
            ต้องส่งกลับเพื่อให้ปิด browser กลางคันแล้วเปิดใหม่ยังเห็นคำตอบเดิม (FR-EVAL-04)

    MyEvaluations:
      type: object
      required:
        - side
        - opened
        - message
        - deadlineUtc
        - artifactUrl
        - completedCount
        - totalCount
        - items
      properties:
        side:
          $ref: '#/components/schemas/Side'
        opened:
          type: boolean
          description: 'false เมื่อ assignment ยังเป็น DRAFT — items จะว่างเสมอตอนนั้น'
        message:
          type: [string, 'null']
          description: อธิบายเหตุผลเมื่อ opened = false หรือเมื่อฝั่งนี้ไม่มีการประเมิน (individualMaxScore = 0)
        deadlineUtc:
          type: [string, 'null']
          format: date-time
          description: null เมื่อ side = INDIVIDUAL แต่ assignment ไม่ได้ตั้ง individualDeadlineUtc
        artifactUrl:
          type: [string, 'null']
          format: uri
          description: ลิงก์เดียวของทั้งงาน (A5) — ต้องเห็นก่อนเริ่มเปรียบเทียบ
        completedCount:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationItem'

    ComparisonSave:
      type: object
      required: [choice]
      properties:
        choice:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            มาตรวัด 6 ระดับ **ไม่มีค่ากลาง** (D1)
            1 = A ดีกว่า B มากที่สุด … 6 = B ดีกว่า A มากที่สุด
        timeOnTaskMs:
          type: integer
          minimum: 0
          description: ใช้ตรวจจับการกดมั่วใน M3 — เก็บตั้งแต่ M1 เพราะย้อนเก็บไม่ได้

    Comparison:
      type: object
      required: [id, pairAssignmentId, choice, status]
      properties:
        id:
          type: string
          format: uuid
        pairAssignmentId:
          type: string
          format: uuid
        choice:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [DRAFT, SUBMITTED, EXCLUDED]
        savedAt:
          type: string
          format: date-time

    SubmissionResult:
      type: object
      required: [side, submittedCount, submittedAt]
      properties:
        side:
          $ref: '#/components/schemas/Side'
        submittedCount:
          type: integer
        submittedAt:
          type: string
          format: date-time

    RecomputeResult:
      type: object
      required: [hasLowConfidenceItems, computedAt]
      properties:
        hasLowConfidenceItems:
          type: boolean
          description: มี item ไหนก็ได้ที่ comparison ยังไม่ถึงเกณฑ์ min_comparisons (S8)
        computedAt:
          type: string
          format: date-time

    FinalizeAssignment:
      type: object
      properties:
        confirmLowConfidence:
          type: boolean
          default: false
          description: ยืนยันว่าต้องการประกาศผลต่อแม้มี item ติด LOW_CONFIDENCE

    FinalizeResult:
      type: object
      required: [status, finalizedAt, hadLowConfidenceItems]
      properties:
        status:
          type: string
          enum: [FINALIZED]
        finalizedAt:
          type: string
          format: date-time
        hadLowConfidenceItems:
          type: boolean

    ReopenAssignment:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: บันทึกลง audit log — ทำไมต้องเปิดคะแนนที่ประกาศแล้วกลับมาแก้

    ScoreOverrideCreate:
      type: object
      required: [side, itemId, overrideValue, reason]
      properties:
        side:
          $ref: '#/components/schemas/Side'
        itemId:
          type: string
          format: uuid
          description: id ของกลุ่ม (side=GROUP) หรือนักศึกษา (side=INDIVIDUAL) ที่จะแก้คะแนน
        criterionId:
          type: [string, 'null']
          format: uuid
          description: ระบุเพื่อ override เฉพาะเกณฑ์เดียว — เว้นว่างเพื่อ override ผลรวมทั้ง item
        overrideValue:
          type: number
        reason:
          type: string
          minLength: 1

    ScoreOverrideResult:
      type: object
      required: [id, originalValue, overrideValue]
      properties:
        id:
          type: string
          format: uuid
        originalValue:
          type: number
          description: ค่าก่อน override (คำนวณล่าสุด หรือ override ก่อนหน้าถ้ามี)
        overrideValue:
          type: number

    MyScore:
      type: object
      required: [finalized, individualHidden]
      properties:
        finalized:
          type: boolean
        message:
          type: [string, 'null']
          description: ข้อความอธิบายเมื่อ finalized เป็น false เช่น "ยังไม่ประกาศผลคะแนน"
        groupComponent:
          type: [number, 'null']
          description: คะแนนของกลุ่มที่นักศึกษาสังกัด — null ถ้ายัง finalized เป็น false
        individualComponent:
          type: [number, 'null']
          description: null ถ้ายังไม่ถึงเกณฑ์ k-anonymity, assignment ไม่มีฝั่งบุคคล, หรือยังไม่ finalize
        individualHidden:
          type: boolean
          description: true เมื่อผู้ประเมินรายบุคคลของนักศึกษาคนนี้ยังไม่ถึงเกณฑ์ k-anonymity (US-15)
        participationRatio:
          type: [number, 'null']
          description: สัดส่วนคู่ที่ตอบเทียบกับที่ได้รับมอบหมายทั้งหมด (ก่อนแปลงเป็นตัวคูณ)
        participationMultiplier:
          type: [number, 'null']
          description: |
            ตัวคูณจากการมีส่วนร่วม (M) — คูณเฉพาะคะแนนส่วนตัวสุดท้ายของนักศึกษาคนนี้
            ไม่กระทบ groupComponent ของกลุ่มเอง (FR-SCORE-11, D5)
        finalScore:
          type: [number, 'null']
          description: |
            (groupComponent + individualComponent) × participationMultiplier
            เป็น null ถ้ายังไม่ finalize หรือ individualHidden เป็น true — ไม่แสดงคะแนนรวม
            บางส่วนที่อาจเผยให้เดาย้อนกลับไปถึงคะแนนรายบุคคลที่ถูกซ่อนไว้ได้
