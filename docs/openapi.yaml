        rightId:
          type: string
          format: uuid
        rightLabel:
          type: string
        completed:
          type: boolean
          description: มี comparison สถานะ SUBMITTED แล้วหรือยัง
        choice:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
          description: |
            ค่าที่เคยเลือกไว้ (DRAFT หรือ SUBMITTED) — null ถ้ายังไม่เคยตอบ
            ต้องส่งกลับเพื่อให้ปิด browser กลางคันแล้วเปิดใหม่ยังเห็นคำตอบเดิม (FR-EVAL-04)

        weightPct:
          type: number
        question:
          type: [string, 'null']
        leftArtifactUrl:
          type: [string, 'null']
          format: uri
        rightArtifactUrl:
          type: [string, 'null']
          format: uri

