    "Assignment":
      "properties":
        "id":
          "type": "string"
          "title": "Id"
        "classroomId":
          "type": "string"
          "title": "Classroomid"
        "name":
          "type": "string"
          "title": "Name"
        "status":
          "type": "string"
          "title": "Status"
          "enum": ["DRAFT","PUBLISHED","OPEN","CLOSED","FINALIZED","ARCHIVED"]
        "groupDeadlineUtc":
          "type": "string"
          "format": "date-time"
          "title": "Groupdeadlineutc"
        "individualDeadlineUtc":
          "anyOf": [{"type":"string","format":"date-time"},{"type":"null"}]
          "title": "Individualdeadlineutc"
        "criteria":
          "items":
            "$ref": "#/components/schemas/Criterion"
          "type": "array"
          "title": "Criteria"
        "opensAtUtc":
          "anyOf": [{"type":"string","format":"date-time"},{"type":"null"}]
          "title": "Opensatutc"
        "description":
          "anyOf": [{"type":"string"},{"type":"null"}]
          "title": "Description"
        "artifactUrl":
          "anyOf": [{"type":"string"},{"type":"null"}]
          "title": "Artifacturl"
        "groupArtifactUrls":
          "additionalProperties":
            "type": "string"
          "type": "object"
          "title": "Groupartifacturls"
        "groupMaxScore":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Groupmaxscore"
          "default": "15"
        "individualMaxScore":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Individualmaxscore"
          "default": "5"
        "targetCoverage":
          "type": "integer"
          "title": "Targetcoverage"
          "default": 5
        "maxWorkload":
          "type": "integer"
          "title": "Maxworkload"
          "default": 8
        "instructorWeight":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Instructorweight"
          "default": "1"
        "minComparisons":
          "type": "integer"
          "title": "Mincomparisons"
          "default": 3
        "scoreFloor":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Scorefloor"
          "default": "0.6"
        "scoreCeiling":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Scoreceiling"
          "default": "1"
        "completionThreshold":
          "type": "string"
          "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$"
          "title": "Completionthreshold"
          "default": "0.9"
      "type": "object"
      "required": ["id","classroomId","name","status","groupDeadlineUtc","individualDeadlineUtc","criteria"]
      "title": "AssignmentOut"
