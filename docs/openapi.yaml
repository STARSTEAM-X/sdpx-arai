      type: object
      description: |
        คู่หนึ่งที่ต้องประเมิน — left/right แบนราบตามตำแหน่งจริงที่สุ่มไว้ตอน publish (D8/FR-PAIR-08)
        รองรับลิงก์ผลงานรายกลุ่มเพิ่มเติมจาก artifactUrl รวมของงาน
      required:
        - pairAssignmentId
