openapi: 3.1.0

info:
  title: PairEval API
  version: 0.2.0-redesign
  license:
    name: MIT
    identifier: MIT
  description: |
    API ของระบบประเมินผลงานนักศึกษาแบบ pairwise comparison

    ครอบคลุม walking skeleton และ frontend redesign: การแจ้งเตือน อุทธรณ์
    วงจรงานประเมิน การถอนรายวิชา รายงานคุณภาพ และการประเมินเพิ่มเติม
    ทุกการเปลี่ยนข้อมูลตรวจสิทธิ์และสถานะจริงที่ server พร้อมเก็บประวัติ

    หลักที่ยึดทั้งไฟล์
    - ทุก endpoint ยกเว้น `/api/health` ต้องมี bearer token
    - ตรวจสิทธิ์ที่ server เสมอ (FR-AUTHZ-01) — ห้ามพึ่ง UI ในการซ่อน
    - ขอ resource ของ classroom ที่ไม่ได้สังกัด ตอบ **404 ไม่ใช่ 403**
      เพื่อไม่ให้รู้ว่า resource นั้นมีอยู่จริง (FR-AUTHZ-02)
    - error ใช้รูปแบบเดียวกันทั้งระบบ และ `code` คงที่สำหรับเครื่องอ่าน (FR-API-03)
    - timestamp ทุกตัวเป็น UTC (DR-05)

servers:
  - url: https://paireval-api.onrender.com
    description: Staging
  - url: http://localhost:8000
    description: Local

security:
  - bearerAuth: []

tags:
  - name: appeals
    description: คำร้องอุทธรณ์คะแนนส่วนตัวและการตอบโดยผู้สอน
  - name: notifications
    description: การแจ้งเตือนในระบบและสถานะการอ่านของผู้ใช้เอง
  - name: health
    description: ตรวจสถานะระบบ
  - name: auth
    description: เข้าสู่ระบบและข้อมูลผู้ใช้ปัจจุบัน
  - name: classrooms
    description: ห้องเรียนและรายชื่อ
  - name: assignments
    description: งานประเมินและการจัดคู่
  - name: evaluation
    description: การประเมินของนักศึกษา
  - name: scoring
    description: คำนวณ ประกาศ และดูคะแนน (US-13, US-15, US-16)

