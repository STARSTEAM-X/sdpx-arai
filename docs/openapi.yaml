        individualOverridden:
          type: boolean
          default: false
          description: ไม่เปิดเผยเมื่อคะแนนรายบุคคลยังถูกปิดด้วย privacy gate
        finalized:
          type: boolean
        message:
          type: [string, 'null']
          description: ข้อความอธิบายเมื่อ finalized เป็น false เช่น "ยังไม่ประกาศผลคะแนน"
        groupComponent:
          type: [number, 'null']
          description: คะแนนของกลุ่มที่นักศึกษาสังกัด — null ถ้ายัง finalized เป็น false
        individualComponent:
          type: [number, 'null']
          description: null ถ้ายังไม่ถึงเกณฑ์ k-anonymity, assignment ไม่มีฝั่งบุคคล, หรือยังไม่ finalize
        individualHidden:
          type: boolean
          description: true เมื่อผู้ประเมินรายบุคคลของนักศึกษาคนนี้ยังไม่ถึงเกณฑ์ k-anonymity (US-15)
        participationRatio:
          type: [number, 'null']
          description: สัดส่วนคู่ที่ตอบเทียบกับที่ได้รับมอบหมายทั้งหมด (ก่อนแปลงเป็นตัวคูณ)
        participationMultiplier:
          type: [number, 'null']
          description: |
            ตัวคูณจากการมีส่วนร่วม (M) — คูณเฉพาะคะแนนส่วนตัวสุดท้ายของนักศึกษาคนนี้
            ไม่กระทบ groupComponent ของกลุ่มเอง (FR-SCORE-11, D5)
        finalScore:
          type: [number, 'null']
          description: |
            (groupComponent + individualComponent) × participationMultiplier
            เป็น null ถ้ายังไม่ finalize หรือ individualHidden เป็น true — ไม่แสดงคะแนนรวม
            บางส่วนที่อาจเผยให้เดาย้อนกลับไปถึงคะแนนรายบุคคลที่ถูกซ่อนไว้ได้

        assignmentName:
          type: [string, 'null']
        groupMaxScore:
          type: [number, 'null']
        individualMaxScore:
          type: [number, 'null']
        finalizedAt:
          type: [string, 'null']
          format: date-time
        submittedCount:
          type: [integer, 'null']
        assignedCount:
          type: [integer, 'null']
        criterionScores:
          type: array
          description: คะแนนรายเกณฑ์จาก snapshot ประกาศล่าสุด รายบุคคลถูกกรองด้วย k-anonymity ก่อนเสมอ
          items:
            type: object
            required: [id, side, name, weightPct, score, maxScore]
            properties:
              id:
                type: string
                format: uuid
              side:
                $ref: '#/components/schemas/Side'
              name:
                type: string
              weightPct:
                type: number
              score:
                type: number
              maxScore:
                type: number

